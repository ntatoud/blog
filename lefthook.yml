#   Refer for explanation to following link:
#   https://lefthook.dev/configuration/
pre-commit:
  parallel: true
  jobs:
    - run: npx --node-options='--experimental-strip-types' eslint {staged_files}
      glob: '*.{js,ts,jsx,tsx}'

    - run: pnpx prettier {staged_files} --write
      glob: '*.{js,ts,jsx,tsx}'
